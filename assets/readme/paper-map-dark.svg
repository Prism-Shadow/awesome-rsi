<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc">
  <title id="title">The Awesome RSI paper map</title>
  <desc id="desc">A left-to-right tree groups papers by RSI artifact, from Parametric and Non-parametric to six artifact categories and representative papers.</desc>
