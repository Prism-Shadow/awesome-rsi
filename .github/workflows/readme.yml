name: Check README catalog

on:
  pull_request:
    paths:
      - 'README.md'
      - 'scripts/generate-readme*'
      - 'site/src/data/**'
      - '.github/workflows/readme.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/generate-readme*'
      - 'site/src/data/**'
      - '.github/workflows/readme.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/generate-readme.test.mjs
      - run: node scripts/generate-readme.mjs --check
